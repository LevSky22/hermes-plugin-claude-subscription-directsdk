name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Allow long paths (hermes-agent's i18n docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: plugin
      # The plugin imports Hermes core (providers, agent) from a checkout, the way an installed plugin does.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      # Hermes core gates every runtime dependency on python_version >= '3.14'; older Pythons install none of them.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install hermes-agent
        run: python -m pip install -e ./hermes-agent pytest pytest-asyncio
      - name: Validate the manifest against core
        shell: bash
        run: python -m hermes_cli.main plugins validate plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
      - name: Run the plugin suite (real subprocess tree, real cancellation)
        working-directory: plugin
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q
      # Mirrors hermes-official-plugins CI: the real Claude Code binary against a loopback peer, offline.
      - name: Run the plugin's CI evals
        if: runner.os != 'Windows'
        working-directory: plugin
        shell: bash
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: bash evals/ci.sh
